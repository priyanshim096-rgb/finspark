apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelx-backend
  labels:
    app: sentinelx-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinelx-backend
  template:
    metadata:
      labels:
        app: sentinelx-backend
    spec:
      containers:
      - name: backend
        image: sentinelx-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: sentinelx-config
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelx-backend-service
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: sentinelx-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelx-frontend
  labels:
    app: sentinelx-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinelx-frontend
  template:
    metadata:
      labels:
        app: sentinelx-frontend
    spec:
      containers:
      - name: frontend
        image: sentinelx-frontend:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelx-frontend-service
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: sentinelx-frontend
  type: LoadBalancer
